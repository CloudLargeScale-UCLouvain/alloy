[package]
name = "kafka_alloy"
version = "0.1.0"
authors = ["Guillaume Rosinosky <guillaumerosinosky@yahoo.fr>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#kafka-protocol = "0.7.0"
kafka-protocol = { path = "../../lib/kafka-protocol-rs", package = "kafka-protocol"}
bytes = "1"
serde_json = "1.0.115"
serde = { version = "1.0.197", features = ["derive"] }
log = "0.4"
fatal = "0.1.1"
byteorder = "1.4.3"
indexmap = "2.0.0"
multimap = "0.10.0"

# response type
routing = { path = "../routing", package = "routing"}
