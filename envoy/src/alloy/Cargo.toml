[package]
name = "alloy"
version = "0.0.1"
authors = ["Guillaume Rosinosky <guillaumerosinosky@yahoo.fr>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
proxy-wasm = { path = "../../lib/proxy-wasm-rust-sdk", package = "proxy-wasm"}
log = {version = "0.4"}
serde_yaml = "0.9.34"
serde_json = { version = "1.0.132", features = ["preserve_order"] }
kafka-protocol = { path = "../../lib/kafka-protocol-rs", package = "kafka-protocol"}
serde = { version = "1.0.197", features = ["derive"] }
routing = { path = "../routing", package = "routing"}
kafka_alloy= { path = "../kafka_alloy", package = "kafka_alloy"}
protobuf = "2"
fatal = "0.1.1"
bytes = "1.5.0"
bincode = "1.3.3"
regex = "1.10.4"
byteorder = "1.4"
string = "0.3.0"
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
getrandom = "0.2"

[build-dependencies]
protoc-rust = "2.0"

[features]
#default = ["trace_time"]
trace_time = []
release_max_level_warn = ["log/release_max_level_warn"]
